<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#190611">
    <title>ParaTiStella</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Trebuchet MS", sans-serif;
        background: #190611;
        color: #fff3f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 48%, rgba(119, 18, 57, 0.4), transparent 48%),
          linear-gradient(145deg, #260916 0%, #16050f 56%, #300916 100%);
      }

      .scene {
        position: relative;
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        isolation: isolate;
        overflow: hidden;
      }

      .scene::before,
      .scene::after {
        position: absolute;
        z-index: -1;
        width: min(80vw, 680px);
        aspect-ratio: 1;
        border: 1px solid rgba(255, 115, 163, 0.08);
        border-radius: 50%;
        content: "";
        animation: halo 7s ease-in-out infinite;
      }

      .scene::after {
        width: min(65vw, 540px);
        animation-delay: -3.5s;
      }

      .heart-field {
        position: absolute;
        z-index: -1;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .floating-heart {
        position: absolute;
        bottom: -12vh;
        color: #f22c52;
        opacity: 0;
        text-shadow: 0 0 14px rgba(255, 30, 78, 0.55);
        animation: rise var(--duration) linear var(--delay) infinite;
      }

      .floating-heart::before {
        content: "♥";
        display: block;
        animation: heartbeat 1.35s ease-in-out infinite;
      }

      .message {
        position: relative;
        display: grid;
        width: min(90vw, 440px);
        aspect-ratio: 1.08 / 1;
        padding: 0;
        border: 0;
        color: inherit;
        background: transparent;
        place-items: center;
        filter: drop-shadow(0 0 30px rgba(255, 53, 126, 0.18));
        animation: heart-beat 2.4s ease-in-out infinite;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .message:focus-visible,
      .kiss-button:focus-visible,
      .close-letter:focus-visible {
        outline: 3px solid #ffe2a6;
        outline-offset: 6px;
      }

      .letter-dialog {
        width: min(90vw, 540px);
        max-width: none;
        max-height: min(88vh, 760px);
        padding: 0;
        overflow: auto;
        border: 1px solid #dfb75e;
        border-radius: 20px;
        color: #381519;
        background: #f7e9c9;
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.58), 0 0 0 6px rgba(198, 151, 59, 0.16);
      }

      .letter-dialog::backdrop {
        background: rgba(15, 3, 10, 0.78);
        backdrop-filter: blur(7px);
      }

      .letter-paper {
        position: relative;
        margin: 10px;
        padding: clamp(2rem, 8vw, 3.5rem) clamp(1.3rem, 7vw, 3rem) 2rem;
        border: 1px solid rgba(147, 37, 42, 0.45);
        border-radius: 13px;
        background:
          radial-gradient(ellipse at 50% 0, rgba(226, 190, 113, 0.24), transparent 55%),
          linear-gradient(135deg, #fff8e9, #f3e2be);
        text-align: center;
      }

      .letter-crest {
        display: grid;
        width: 58px;
        height: 66px;
        margin: 0 auto 1rem;
        place-items: center;
        border: 2px solid #d6ad56;
        border-radius: 48% 48% 45% 45%;
        color: #f6d989;
        background: linear-gradient(145deg, #a41f2b, #5e101d);
        box-shadow: inset 0 0 0 4px rgba(249, 224, 161, 0.13), 0 5px 15px rgba(78, 20, 24, 0.2);
        font-size: 1.8rem;
      }

      .letter-kicker {
        margin: 0;
        color: #8e6829;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .letter-title {
        margin: 0.55rem 0 1.6rem;
        color: #761b28;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 8vw, 2.8rem);
        font-weight: 600;
      }

      .letter-copy {
        max-width: 34ch;
        margin: 0 auto;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.05rem, 4vw, 1.2rem);
        line-height: 1.85;
      }

      .letter-signature {
        margin: 1.8rem 0 1.5rem;
        color: #861d2c;
        font-family: "Segoe Script", "Brush Script MT", cursive;
        font-size: clamp(1.55rem, 6vw, 2rem);
      }

      .letter-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .kiss-button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: 0.75rem 1.15rem;
        border: 1px solid #d8b15c;
        border-radius: 999px;
        color: #fff3d3;
        background: linear-gradient(135deg, #a32632, #681523);
        box-shadow: 0 5px 14px rgba(88, 22, 29, 0.23);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .kiss-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(88, 22, 29, 0.3);
      }

      .kiss-button-heart {
        color: #ffd3d6;
        font-size: 1.25rem;
      }

      .close-letter {
        min-height: 44px;
        padding: 0.6rem 0.8rem;
        border: 0;
        color: #6b4d34;
        background: transparent;
        font: inherit;
        cursor: pointer;
      }

      .kiss-field {
        position: fixed;
        z-index: 5;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .flying-kiss {
        position: absolute;
        top: var(--top);
        left: var(--left);
        opacity: 0;
        font-size: var(--size);
        filter: drop-shadow(0 3px 8px rgba(58, 0, 16, 0.28));
        animation: kiss-pop 4.8s ease-in-out both;
      }

      @keyframes kiss-pop {
        0% { transform: translateY(24px) scale(0.25) rotate(-18deg); opacity: 0; }
        12% { transform: translateY(0) scale(1.15) rotate(8deg); opacity: 1; }
        75% { transform: translateY(-18px) scale(1) rotate(-8deg); opacity: 1; }
        100% { transform: translateY(-38px) scale(0.75) rotate(12deg); opacity: 0; }
      }

      .message-heart {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .message-heart path {
        fill: url("#heart-fill");
        stroke: rgba(255, 179, 207, 0.8);
        stroke-width: 2;
      }

      .message-copy {
        z-index: 1;
        margin-top: -1%;
        text-align: center;
      }

      .name {
        margin: 0;
        color: #ffb6d2;
        font-family: "Segoe Script", "Brush Script MT", cursive;
        font-size: clamp(3.3rem, 13vw, 5.7rem);
        font-weight: 600;
        line-height: 1.1;
        text-shadow: 0 2px 24px rgba(255, 145, 189, 0.65);
      }

      .declaration {
        margin: 0.55rem 0 0;
        color: #fff5f8;
        font-size: clamp(0.9rem, 3.2vw, 1.15rem);
        font-weight: 700;
        letter-spacing: 0.38em;
        text-indent: 0.38em;
        text-shadow: 0 0 16px rgba(255, 223, 236, 0.75);
      }

      .sparkle {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #ffd3e3;
        box-shadow: 0 0 14px 4px rgba(255, 160, 194, 0.7);
        animation: twinkle 2.2s ease-in-out infinite;
      }

      .sparkle-one {
        top: 24%;
        left: 20%;
      }

      .sparkle-two {
        right: 17%;
        bottom: 30%;
        animation-delay: -1.1s;
      }

      @keyframes rise {
        0% {
          transform: translate3d(0, 0, 0) rotate(-12deg) scale(0.65);
          opacity: 0;
        }

        12% {
          opacity: var(--opacity);
        }

        50% {
          transform: translate3d(var(--drift), -58vh, 0) rotate(12deg) scale(1);
        }

        88% {
          opacity: var(--opacity);
        }

        100% {
          transform: translate3d(calc(var(--drift) * -0.5), -118vh, 0) rotate(-10deg) scale(0.75);
          opacity: 0;
        }
      }

      @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        15% { transform: scale(1.2); }
        30% { transform: scale(1); }
        45% { transform: scale(1.13); }
      }

      @keyframes heart-beat {
        0%, 100% { transform: scale(1); }
        8% { transform: scale(1.035); }
        17% { transform: scale(1); }
        25% { transform: scale(1.02); }
        34% { transform: scale(1); }
      }

      @keyframes halo {
        0%, 100% { transform: scale(0.96); opacity: 0.45; }
        50% { transform: scale(1.04); opacity: 1; }
      }

      @keyframes twinkle {
        0%, 100% { transform: scale(0.6); opacity: 0.35; }
        50% { transform: scale(1.4); opacity: 1; }
      }

      @media (max-width: 480px) {
        .message {
          width: min(96vw, 390px);
        }
      }

        @media (max-width: 420px) {
          .letter-actions {
            gap: 0.35rem;
          }
        }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="heart-field" id="heart-field" aria-hidden="true"></div>
      <button class="message" id="open-letter" type="button" aria-label="Abrir la carta para Stella" aria-haspopup="dialog">
        <svg class="message-heart" viewBox="0 0 512 480" aria-hidden="true">
          <defs>
            <linearGradient id="heart-fill" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#f33c83"></stop>
              <stop offset="55%" stop-color="#c91655"></stop>
              <stop offset="100%" stop-color="#8f103f"></stop>
            </linearGradient>
          </defs>
          <path d="M256 455 49 248C-40 159 24 11 145 11c49 0 87 28 111 68 24-40 62-68 111-68 121 0 185 148 96 237L256 455Z"></path>
        </svg>
        <div class="message-copy">
          <h1 class="name">Stella</h1>
          <p class="declaration">I LOVE YOU</p>
        </div>
        <span class="sparkle sparkle-one" aria-hidden="true"></span>
        <span class="sparkle sparkle-two" aria-hidden="true"></span>
      </button>
    </main>
    <dialog class="letter-dialog" id="letter-dialog" aria-labelledby="letter-title">
      <article class="letter-paper">
        <div class="letter-crest" aria-hidden="true">🦁</div>
        <p class="letter-kicker">Una carta para ti</p>
        <h2 class="letter-title" id="letter-title">Querida Stella</h2>
        <p class="letter-copy">Eres una persona muy especial para mí, quiero que se den las maneras que se deba hacer, quiero tener buenos momentos contigo y estar al momento que ocupes.</p>
        <p class="letter-signature">Con cariño, Yael</p>
        <div class="letter-actions">
          <button class="kiss-button" id="send-kisses" type="button">
            <span class="kiss-button-heart" aria-hidden="true">♥</span>
            Llenar de besos
            <span class="kiss-button-heart" aria-hidden="true">♥</span>
          </button>
          <button class="close-letter" id="close-letter" type="button">Cerrar</button>
        </div>
      </article>
    </dialog>
    <div class="kiss-field" id="kiss-field" aria-hidden="true"></div>
    <script>
      const heartField = document.querySelector("#heart-field");
      const heartCount = 28;
      const letterDialog = document.querySelector("#letter-dialog");
      const openLetter = document.querySelector("#open-letter");
      const kissField = document.querySelector("#kiss-field");
      let kissTimeout;

      for (let index = 0; index < heartCount; index += 1) {
        const heart = document.createElement("span");
        heart.className = "floating-heart";
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.fontSize = `${14 + Math.random() * 30}px`;
        heart.style.setProperty("--duration", `${9 + Math.random() * 13}s`);
        heart.style.setProperty("--delay", `${-Math.random() * 22}s`);
        heart.style.setProperty("--drift", `${-70 + Math.random() * 140}px`);
        heart.style.setProperty("--opacity", `${0.3 + Math.random() * 0.55}`);
        heartField.append(heart);
      }

      openLetter.addEventListener("click", () => letterDialog.showModal());
      document.querySelector("#close-letter").addEventListener("click", () => letterDialog.close());
      letterDialog.addEventListener("click", (event) => {
        if (event.target === letterDialog) letterDialog.close();
      });

      document.querySelector("#send-kisses").addEventListener("click", () => {
        window.clearTimeout(kissTimeout);
        kissField.replaceChildren();

        for (let index = 0; index < 85; index += 1) {
          const kiss = document.createElement("span");
          kiss.className = "flying-kiss";
          kiss.textContent = "💋";
          kiss.style.setProperty("--top", `${Math.random() * 100}%`);
          kiss.style.setProperty("--left", `${Math.random() * 100}%`);
          kiss.style.setProperty("--size", `${20 + Math.random() * 30}px`);
          kissField.append(kiss);
        }

        kissTimeout = window.setTimeout(() => kissField.replaceChildren(), 5000);
      });
    </script>
  </body>
</html>
